<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4D Maze</title>
<link rel="stylesheet" href="../shared/style.css?v=21">
<style>
  /* The shared sheet sizes #mapPanel for unknot's one wide diagram. Two square
     slices side by side set their own width. */
  #mapPanel { width: auto; }

  /* The maze's own furniture: a legend for what the rope is doing.

     Unknot's rope is one strand and needs no key -- there is nothing to
     confuse it with. A maze's rope forks, and the two things worth telling
     apart are a junction (a choice) and a stub leaving the slice (a choice
     you cannot see the far end of). Both are marked in the scene; this says
     what the marks mean. */
  .legend { display: grid; gap: 6px; margin-top: 10px; }
  .legend div { display: flex; align-items: center; gap: 8px;
                font-size: 12px; color: var(--dim); }
  .swatch { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  /* The way out of a slice is marked by an ARROW in the scene, not by a colour
     -- it takes the colour of the cell it leaves, like every other passage. So
     its key is the shape, drawn as a triangle rather than a dot. */
  .swatch.arrow { border-radius: 0; background: none !important;
                  width: 0; height: 0; margin: 0 1px;
                  border-left: 5px solid transparent;
                  border-right: 5px solid transparent;
                  border-bottom: 10px solid var(--dim); }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div class="panel" id="hud">
  <h1 id="title">—</h1>
  <p id="blurb"></p>
  <div id="status"></div>
  <div class="legend">
    <div><span class="swatch" id="swStart"></span><span id="legendStart"></span></div>
    <div><span class="swatch" id="swExit"></span><span id="legendExit"></span></div>
    <div><span class="swatch" id="swJunction"></span><span id="legendJunction"></span></div>
    <div><span class="swatch arrow" id="swW"></span><span id="legendW"></span></div>
  </div>
  <div class="controls">
    <button id="reset"></button>
  </div>
</div>

<!-- Two slices through where the player stands, side by side, each with the
     keys that move in its plane directly above it. The layout, the columns and
     the phone rules are shared furniture -- see .mapcols in shared/style.css
     and shared/slicepanels.js. -->
<div class="panel mapcols" id="mapPanel">
  <div class="mapcol">
    <div class="padcluster" id="padVertical"></div>
    <svg id="mapWY" viewBox="0 0 200 200" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="mapfoot" id="mapWYFoot"></div>
  </div>
  <div class="mapcol">
    <div class="padcluster" id="padHorizontal"></div>
    <svg id="mapXZ" viewBox="0 0 200 200" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="mapfoot" id="mapXZFoot"></div>
  </div>
</div>

<script type="module" src="./src/app.js"></script>
</body>
</html>
